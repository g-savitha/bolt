# Release: git tag v0.1.0 && git push --tags
# Local snapshot: goreleaser build --snapshot --clean
version: 2

project_name: bolt

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bolt
    main: ./cmd/bolt
    binary: bolt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - QUICKSTART.md

checksum:
  name_template: "SHA256SUMS"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: g-savitha
    name: bolt
  draft: false
  prerelease: false

brews:
  - name: bolt
    ids:
      - bolt
    repository:
      owner: g-savitha
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/g-savitha/bolt"
    description: "Fast terminal P2P chat and file transfer"
    license: MIT
    install: |
      bin.install "bolt"
    test: |
      system "#{bin}/bolt", "version"
    skip_upload: auto

scoops:
  - name: bolt
    ids:
      - bolt
    repository:
      owner: g-savitha
      name: scoop-bolt
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/g-savitha/bolt"
    description: "Fast terminal P2P chat and file transfer"
    license: MIT
    skip_upload: auto
