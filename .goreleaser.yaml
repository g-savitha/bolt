# Release: git tag v0.1.1 && git push --tags
# Local snapshot: goreleaser build --snapshot --clean
version: 2

project_name: bolt

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bolt
    main: ./cmd/bolt
    binary: bolt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - QUICKSTART.md

checksum:
  name_template: "SHA256SUMS"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: g-savitha
    name: bolt
  draft: false
  prerelease: false

# Homebrew and Scoop publishers are wired in manually via:
#   packaging/homebrew/Formula/bolt.rb  (update sha256 from SHA256SUMS after each release)
#   packaging/scoop/bolt.json           (update hash from SHA256SUMS after each release)
