# SonarCloud project configuration
# Docs: https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/github-actions-for-sonarcloud/
#
# One-time setup required:
#   1. Sign in at https://sonarcloud.io with your GitHub account
#   2. Click "+" → "Analyze new project" → import g-savitha/bolt
#   3. Note the organization key (usually your GitHub username) and project key
#   4. Add SONAR_TOKEN to repo secrets: Settings → Secrets → Actions → New secret

sonar.projectKey=g-savitha_bolt
sonar.organization=g-savitha

# Sources and tests
sonar.sources=.
sonar.exclusions=**/*_test.go,dist/**,packaging/**,scripts/**,vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage — generated by `go test -coverprofile=coverage.out ./...` in ci.yml
sonar.go.coverage.reportPaths=coverage.out

# Language / encoding
sonar.language=go
sonar.sourceEncoding=UTF-8
