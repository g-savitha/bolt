version: "2"

linters:
  enable:
    # security — maps directly to OWASP Top 10 Go patterns
    - gosec
    # correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    # style / readability
    - misspell
    - gofmt
    - whitespace

  settings:
    gosec:
      # Report everything; individual suppressions via //nolint:gosec with a reason.
      confidence: low
      severity: low

    govet:
      enable-all: true
      disable:
        - shadow  # too noisy for idiomatic Go

    errcheck:
      # Ignore errors from fmt.Print* family — acceptable in CLI output paths.
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
      check-type-assertions: true

    staticcheck:
      checks: ["all"]

issues:
  exclude-rules:
    # Test files get a relaxed security and error-check policy.
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck

  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
